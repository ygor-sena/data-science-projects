[pytest]
DJANGO_SETTINGS_MODULE = mercadinho.settings
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -ra
markers =
    unit: regras puras, sem banco nem HTTP (base da pirâmide)
    integration: banco de dados real e API REST via HTTP
    e2e: jornadas completas do usuário (topo da pirâmide)
